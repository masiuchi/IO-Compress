name: Ruby CI Simple

on: [push, pull_request]

jobs:
  ruby:
    runs-on: windows-latest
    
    strategy:
      matrix:
        ruby-version: ['3.1', '3.2', '3.3']

    steps:
    - uses: actions/checkout@v4
    
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    
    - run: which gcc
    - run: which ruby
    - run: gcc --version
    - run: ruby -rrbconfig -e "puts RbConfig::CONFIG.sort.map {|k,v| sprintf('%-30s = %s', k, v)}"
    - run: set
