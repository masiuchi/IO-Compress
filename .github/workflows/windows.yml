name: Windows build

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '01 01 * * 6'    # Run every Saturday

jobs:
  build:

    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        perl:
          # - 'develop'
          - '5.42'
          - '5.40'
          - '5.38'
          - '5.36'
          # - '5.34'
          # - '5.32'
          # - '5.30'
          # - '5.28'
          # - '5.26'
          # - '5.24'
          # - '5.22'
          # - '5.20'
          # - '5.18'
          # - '5.16'
          # - '5.14'
          # - '5.12'
          # - '5.10'
          # - '5.8'
        distribution:
            - 'default'
            - 'strawberry'

    name: Perl ${{ matrix.perl }} distribution:${{ matrix.distribution }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: ${{ matrix.perl }}
        distribution: ${{ matrix.distribution }}
    - name: Install packages
      run: choco install make
    - name: Perl version
      run: perl -V
    - name: gcc version
      run: gcc --version
    - name: gcc version (mingw)
      run: C:\mingw64\bin\gcc.exe --version
    - name: perl path
      run: Get-Command perl -All
    - name: gcc path
      run: Get-Command gcc -All
    - name: environment variables
      run: "Get-ChildItem Env:"
    - name: Install dependencies
      run: cpanm -v --installdeps .
    - name: Build
      run: perl Makefile.PL && make
    - name: Test
      run: make test
